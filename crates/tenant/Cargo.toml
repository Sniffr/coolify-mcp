[package]
name = "tenant"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
safety = { path = "../safety" }
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
