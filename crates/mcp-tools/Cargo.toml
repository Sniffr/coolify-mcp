[package]
name = "mcp-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
coolify-api = { path = "../coolify-api" }
safety = { path = "../safety" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = "0.12"
thiserror = "2"
async-trait = "0.1"
percent-encoding = "2"
url = "2"
tokio = { version = "1", features = ["macros", "rt"] }
