name: hosted-deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Dockerfile.rust"
      - "deploy/**"
      - ".github/workflows/hosted-deploy.yml"
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Build and verify only (skip SSH deploy)"
        required: false
        default: "false"

concurrency:
  group: hosted-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/coolify-mcp
  REMOTE_APP_DIR: ${{ vars.REMOTE_APP_DIR || '/home/sidney/coolify-mcp' }}
  REMOTE_ENV_FILE: ${{ vars.REMOTE_ENV_FILE || '/home/sidney/coolify-mcp/secrets/multitenant.env' }}
  BASE_URL: ${{ vars.BASE_URL || 'https://mcp.social.dpdns.org' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=multitenant,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile.rust
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_deploy != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_IMAGE: ghcr.io/${{ github.repository_owner }}/coolify-mcp:multitenant
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: DEPLOY_IMAGE,REMOTE_APP_DIR,REMOTE_ENV_FILE,BASE_URL
          script: |
            set -eu
            echo "Pulling $DEPLOY_IMAGE"
            docker pull "$DEPLOY_IMAGE"
            docker tag "$DEPLOY_IMAGE" sniffr-coolify-mcp:multitenant
            cd "$REMOTE_APP_DIR"
            MCP_ENV_FILE="$REMOTE_ENV_FILE" docker compose -f deploy/multitenant-compose.yaml up -d --force-recreate
            sleep 15
            MCP_ENV_FILE="$REMOTE_ENV_FILE" docker compose -f deploy/multitenant-compose.yaml ps
            MCP_ENV_FILE="$REMOTE_ENV_FILE" BASE_URL="$BASE_URL" bash deploy/remote-check.sh
