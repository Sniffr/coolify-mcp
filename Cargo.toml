[package]
name = "sniffr-coolify-mcp"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/coolify-api",
    "crates/safety",
    "crates/oauth",
    "crates/transport",
    "crates/mcp-tools",
    "crates/doctor",
    "crates/tenant",
]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
coolify-api = { path = "crates/coolify-api" }
safety = { path = "crates/safety" }
oauth = { path = "crates/oauth" }
transport = { path = "crates/transport" }
mcp-tools = { path = "crates/mcp-tools" }
doctor = { path = "crates/doctor" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
sha2 = "0.10"
url = "2"

[[bin]]
name = "fake-coolify"
path = "tests/fake-coolify/server.rs"

[[bin]]
name = "stdio-interop"
path = "tests/client-interop/stdio_client.rs"

[[bin]]
name = "http-oauth-interop"
path = "tests/client-interop/http_oauth.rs"
